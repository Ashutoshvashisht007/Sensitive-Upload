<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sensitive Upload Guard</title>
  <style>
    :root { color-scheme: light dark; --fg: #0f172a; --muted: #475569; --bg: #ffffff; --card: #f8fafc; --line: #e2e8f0; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e2e8f0; --muted: #94a3b8; --bg: #0f172a; --card: #1e293b; --line: #334155; } }
    body { font: 14px/1.5 -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0; padding: 32px 16px; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
    h2 { font-size: 14px; margin: 0 0 12px; }
    label { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    input[type=color] { width: 44px; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: none; }
    .status { display: flex; align-items: center; gap: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #94a3b8; flex: none; }
    .dot.ok { background: #15803d; } .dot.bad { background: #b91c1c; }
    code { background: var(--line); padding: 1px 5px; border-radius: 4px; }
    button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
    .muted { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>Sensitive Upload Guard</h1>
  <p class="sub">Asks before prompts or files containing <code>WALLED_SENSITIVE</code> reach ChatGPT or Perplexity.</p>

  <section>
    <h2>Desktop app</h2>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Checking…</span></div>
    <p class="muted">If it isn't reachable, run <code>upload-guard install</code> and reload this page.</p>
    <button id="recheck">Check again</button>
  </section>

  <section>
    <h2>AI response colour</h2>
    <label><input type="checkbox" id="recolor"> Recolour AI responses</label>
    <label><input type="color" id="colorLight"> Light theme</label>
    <label><input type="color" id="colorDark"> Dark theme</label>
    <button id="reset">Reset colours</button>
  </section>

  <section>
    <h2>Troubleshooting</h2>
    <label><input type="checkbox" id="debug"> Log decisions to the page console (prefix <code>[UploadGuard]</code>). No content is logged.</label>
  </section>
</main>
<script src="options.js"></script>
</body>
</html>
