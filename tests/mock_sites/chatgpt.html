<!doctype html>
<!-- Local copy of chatgpt.com's structure for the browser tests. The test
     server hands it out AS https://chatgpt.com/ through the guard, with a
     Content-Security-Policy that uses style nonces like the real site.
     Sending and uploading make the same kind of network calls as the real app:
       send    POST /backend-api/f/conversation (JSON, prompt in messages[].content.parts)
       upload  POST /backend-api/files (file name and size) → PUT bytes to the returned
               https://sdmntpr….oaiusercontent.com/files/<id>/raw URL → POST …/process_upload_stream
               (the live site's flow when it names the file first; its newer upload_reservations
               flow names the file only after the bytes, covered in tests/test_addon.py) -->
<html lang="en-US" class="chatgpt-theme" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>ChatGPT (mock)</title>
  <style nonce="sitenonce">
    body { font-family: -apple-system, sans-serif; margin: 0; color: #0d0d0d; background: #fff; }
    main { max-width: 760px; margin: 0 auto; padding: 24px; }
    .hidden { display: none; }
    [data-user-message-bubble] { margin-left: auto; max-width: 70%; background: #f4f4f4; border-radius: 18px; padding: 8px 14px; }
    .ProseMirror { min-height: 40px; border: 1px solid #ccc; border-radius: 16px; padding: 10px 14px; }
  </style>
</head>
<body>
<div id="root">
  <main>
    <div data-conversation-role="user"><div data-user-message-bubble><div>What is a DLP tool?</div></div></div>
    <div data-conversation-role="assistant">
      <div data-response-body="m1">
        <div data-markdown-text-style="assistant-message">
          <p>A data loss prevention tool watches data leaving a system.</p>
          <pre><code>print("hello")</code></pre>
        </div>
      </div>
    </div>
    <form id="composer-form">
      <input type="file" class="hidden" aria-label="Attach files" multiple>
      <div data-composer-input>
        <div contenteditable="true" role="textbox" aria-label="Ask ChatGPT" class="ProseMirror"><p></p></div>
      </div>
      <button type="submit" aria-label="Send">↑</button>
    </form>
    <h3>Sent</h3><ol id="sent-log"></ol>
    <h3>Errors</h3><ol id="error-log"></ol>
    <h3>Uploaded</h3><ol id="upload-log"></ol>
    <h3>Upload errors</h3><ol id="upload-error-log"></ol>
  </main>
</div>
<script>
(() => {
  const editor = document.querySelector('[data-composer-input] [contenteditable="true"]');
  const form = document.getElementById("composer-form");
  const input = document.querySelector('input[aria-label="Attach files"]');
  const log = (id, text) => { const li = document.createElement("li"); li.textContent = text; document.getElementById(id).appendChild(li); };

  async function send() {
    const text = editor.innerText.trim();
    if (!text) return;
    editor.innerHTML = "<p></p>";  // the real app clears the box when sending
    try {
      const r = await fetch("/backend-api/f/conversation", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ action: "next", messages: [{ author: { role: "user" }, content: { content_type: "text", parts: [text] } }] }),
      });
      if (r.ok) log("sent-log", text);
      else log("error-log", `${r.status} ${(await r.json().catch(() => ({}))).detail || ""}`);
    } catch (e) { log("error-log", "network " + e); }
  }

  async function upload(file) {
    try {
      const meta = await fetch("/backend-api/files", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ file_name: file.name, file_size: file.size, use_case: "my_files" }),
      });
      const { file_id, upload_url } = await meta.json();
      const r = await fetch(upload_url, { method: "PUT", headers: { "x-ms-blob-type": "BlockBlob", "content-type": file.type || "application/octet-stream" }, body: file });
      if (!r.ok) { log("upload-error-log", `${file.name} ${r.status}`); return; }
      await fetch("/backend-api/files/process_upload_stream", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ file_id, file_name: file.name }) });
      log("upload-log", file.name);
    } catch (e) { log("upload-error-log", `${file.name} network`); }
  }

  editor.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  form.addEventListener("submit", (e) => { e.preventDefault(); send(); });
  input.addEventListener("change", () => { for (const f of input.files) upload(f); input.value = ""; });
})();
</script>
</body>
</html>
