<!doctype html>
<!-- Local copy of www.perplexity.ai's structure for the browser tests, handed
     out AS https://www.perplexity.ai/ through the guard. Network calls:
       typing  GET /rest/autosuggest/list-autosuggest?query=…  (sent while typing)
       send    POST /rest/sse/perplexity_ask (JSON, prompt in query_str)
       upload  POST /rest/uploads/create_upload_url (file name) → multipart POST of the
               file to the returned https://ppl-ai-file-upload.s3.amazonaws.com/ bucket -->
<html lang="en" data-color-scheme="dark">
<head>
  <meta charset="utf-8">
  <title>Perplexity (mock)</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; color: #e8e8e6; background: #191a1a; }
    main { max-width: 760px; margin: 0 auto; padding: 24px; }
    [role="textbox"] { min-height: 40px; border: 1px solid #444; border-radius: 12px; padding: 10px 14px; }
  </style>
</head>
<body>
<main>
  <h1 class="group/query">What is a DLP tool?</h1>
  <div class="prose dark:prose-invert">
    <p>Data loss prevention software detects and blocks sensitive data leaving an organisation.</p>
    <ul><li>Endpoint agents</li><li>Network monitors</li></ul>
  </div>
  <div contenteditable="true" role="textbox" aria-label="Ask a follow-up"><p><br></p></div>
  <input type="file" aria-label="Attach" multiple>
  <button type="button" aria-label="Submit">→</button>
  <h3>Sent</h3><ol id="sent-log"></ol>
  <h3>Errors</h3><ol id="error-log"></ol>
  <h3>Uploaded</h3><ol id="upload-log"></ol>
  <h3>Upload errors</h3><ol id="upload-error-log"></ol>
</main>
<script>
(() => {
  const editor = document.querySelector('[role="textbox"]');
  const input = document.querySelector('input[type="file"]');
  const log = (id, text) => { const li = document.createElement("li"); li.textContent = text; document.getElementById(id).appendChild(li); };

  editor.addEventListener("input", () => {
    const q = editor.innerText.trim();
    if (q) fetch("/rest/autosuggest/list-autosuggest?query=" + encodeURIComponent(q)).catch(() => {});
  });

  async function send() {
    const text = editor.innerText.trim();
    if (!text) return;
    editor.innerHTML = "<p><br></p>";
    try {
      const r = await fetch("/rest/sse/perplexity_ask", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ query_str: text, params: { source: "default", mode: "concise" } }),
      });
      if (r.ok) log("sent-log", text);
      else log("error-log", `${r.status} ${(await r.json().catch(() => ({}))).detail || ""}`);
    } catch (e) { log("error-log", "network " + e); }
  }

  async function upload(file) {
    try {
      const meta = await fetch("/rest/uploads/create_upload_url", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ filename: file.name, content_type: file.type, source: "default" }),
      });
      const { s3_bucket_url, fields } = await meta.json();
      const fd = new FormData();
      for (const [k, v] of Object.entries(fields)) fd.append(k, v);
      fd.append("file", file);
      const r = await fetch(s3_bucket_url, { method: "POST", body: fd });
      if (r.ok) log("upload-log", file.name); else log("upload-error-log", `${file.name} ${r.status}`);
    } catch (e) { log("upload-error-log", `${file.name} network`); }
  }

  editor.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  document.querySelector('button[aria-label="Submit"]').addEventListener("click", send);
  input.addEventListener("change", () => { for (const f of input.files) upload(f); input.value = ""; });
})();
</script>
</body>
</html>
